<div id="inventorius">
	
	<div id="inventoriausBlokai"></div>
	
</div>

<div id="greitaJuosta">
    <div class="greitasLangelis"></div>
	<div class="greitasLangelis"></div>

	<div class="greitasLangelis"></div>
	<div class="greitasLangelis"></div>

<script src="https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.js"></script>

<div id="taikiklis">+</div>

<audio id="zingsnioGarsas" src="garsai/zingsnis.wav"></audio>

</body>
<script>
const canvas = document.createElement("canvas");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

canvas.style.width = "100%";
canvas.style.height = "100%";
canvas.style.display = "block";

document.body.style.margin = "0";
document.body.style.overflow = "hidden";
document.body.appendChild(canvas);

const engine = new BABYLON.Engine(canvas, true);
const zingsnioGarsas = document.getElementById("zingsnioGarsas");

function grotiZingsni() {
    zingsnioGarsas.currentTime = 0;
	zingsnioGarsas.volume = 1;
	zingsnioGarsas.play();
}

const scene = window.scene = new BABYLON.Scene(engine);
scene.collisionsEnabled = true;
scene.gravity = new BABYLON.Vector3(0, -0.15, 0);
scene.collisionsEnabled = true;
scene.clearColor = new BABYLON.Color4(0.4, 0.7, 1, 1);

const kamera = new BABYLON.UniversalCamera("kamera", new BABYLON.Vector3(0, 1, -5), scene);

kamera.attachControl(canvas, true);
canvas.addEventListener("click", function() {
    canvas.requestPointerLock();
});
kamera.inputs.addKeyboard();

kamera.keysUp.push(38, 87);
kamera.keysDown.push(40, 83);
kamera.keysLeft.push(37, 65);
kamera.keysRight.push(39, 68);

kamera.speed = 0.5;
kamera.inputs.add(new BABYLON.FreeCameraKeyboardMoveInput());

kamera.applyGravity = true;
kamera.checkCollisions = true;
kamera.onCollide = function(mesh) {
    console.log("Susidurta su: " + mesh.name);
};
kamera.ellipsoid = new BABYLON.Vector3(0.4, 0.9, 0.4);
kamera.setTarget(BABYLON.Vector3.Zero());

const sviesa = new BABYLON.HemisphericLight("sviesa", new BABYLON.Vector3(0, 1, 0), scene);
sviesa.intensity = 0.8;

const tekstura = new BABYLON.DynamicTexture("zolesTeskstura", { width: 16, height: 16 }, scene);
const ctx = tekstura.getContext();

ctx.fillStyle = "#4b8f32";
ctx.fillRect(0, 0, 16, 16);

ctx.fillStyle = "#36752b";
ctx.fillRect(2, 3, 2, 2);
ctx.fillRect(10, 5, 2, 2);
ctx.fillRect(6, 11, 2, 2);

ctx.fillStyle = "#65a83b";
ctx.fillRect(4, 1, 2, 2);
ctx.fillRect(12, 9, 2, 2);
ctx.fillRect(1, 13, 2, 2);

tekstura.update();

const medis = new BABYLON.StandardMaterial("medis", scene);
medis.diffuseColor = new BABYLON.Color3(0.4, 0.2, 0.1);

const kamienas = BABYLON.MeshBuilder.CreateBox("kamienas", {
    width: 1,
	height: 3,
	depth: 1
}, scene);

kamienas.material = medis;
kamienas.position.set(5, -0.5, 4);

for (let x = -5; x < 50; x++) {
    for (let z = -5; z < 50; z++) {
	    const aukstis = Math.floor(Math.random() * 2);
	    const blokas = BABYLON.MeshBuilder.CreateBox("zolesBlokas", {
		    size: 1
		}, scene);
		
		const generavimoScene = window.scene;
		
		blokas.position.set(x, -2, z);
		
		const medziaga = new BABYLON.StandardMaterial("zalia", scene);
		medziaga.diffuseTexture = tekstura;
		medziaga.specularColor = new BABYLON.Color3(0, 0, 0)
		medziaga.diffuseColor = new BABYLON.Color3(0.2, 0.7, 0.2);
		
		blokas.material = medziaga;
		blokas.checkCollisions = true;
	}
}

engine.runRenderLoop(function() {

	scene.render();
});

scene.onPointerDown = function (evt, pickResult) {
    if (!pickResult.hit) return;
	
	if (evt.button === 0) {
	    pickResult.pickedMesh.dispose();
	}
	
	if (evt.button === 2) {
	    const normal = pickResult.getNormal(true);
		
		if (!normal) return;
		
		const point = pickResult.pickedPoint.add(normal.scale(0.51));
		
		const naujasBlokas = BABYLON.MeshBuilder.CreateBox("zoles blokas", {
		    size: 1
		}, scene);
		
		naujasBlokas.position.set(
		
		    Math.round(point.x),
			Math.round(point.y),
			Math.round(point.z)
		);
		
		naujasBlokas.checkCollisions = true;
		
		naujasBlokas.material = pickResult.pickedMesh.material;
	}
};

const zeme = new BABYLON.StandardMaterial("zeme", scene);

const lapai = new BABYLON.StandardMaterial("lapai", scene);
lapai.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.1);

zeme.diffuseColor = new BABYLON.Color3(0.45, 0.25, 0.12);

const medzioTekstura = new BABYLON.DynamicTexture("medzioTekstura", {
    width: 256,
	height: 256
}, scene);

const medzioCtx = medzioTekstura.getContext();

medzioCtx.fillStyle = "#a66b3f";
medzioCtx.fillRect(0, 0, 256, 256);

for (let i = 0; i < 32; i++) {
    medzioCtx.fillStyle = "#70401f";
	medzioCtx.fillRect(i * 8, 0, 3, 256);
}

medzioTekstura.update();
medis.diffuseTexture = medzioTekstura;

medis.diffuseColor = new BABYLON.Color3(0.45, 0.25, 0.1);

const medzioBlokas = new BABYLON.MeshBuilder.CreateBox("medzioBlokas", {
    size: 1
}, scene);

medzioBlokas.material = medis;
medzioBlokas.checkCollisions = true;
medzioBlokas.position.set(3, 0.5, 3);

scene.onKeyboardObservable.add((kbInfo) => {
    if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN &&
	    kbInfo.event.code === "Space" &&
		kamera.position.y <= 2) {
		kamera.cameraDirection.y = 0.4;
	}
});

let kiaule = null;

function sukurtiKiaule(x, y, z) {
    kiaule = new BABYLON.TransformNode("kiaule", scene);
	kiaule.position.set(x, y, z);
    const kunas = BABYLON.MeshBuilder.CreateBox("kiaulesKunas", {
	    width: 1.2,
		height: 0.8,
		depth: 0.7
	}, scene);
	
	kunas.parent = kiaule;
	kunas.position.set(0, 0.8, 0);
	
	const rozine = new BABYLON.StandardMaterial("kiaulesSpalva", scene);
	rozine.diffuseColor = new BABYLON.Color3(1, 0.45, 0.6);
	
	kunas.material = rozine;
	kunas.metadata = { mobas: true };
	
	const galva = BABYLON.MeshBuilder.CreateBox("kiaulesGalva", {
	    size: 0.65
	}, scene);
	
	galva.parent = kiaule;
	galva.position.set(0, 1.15, 0.55);
	galva.material = rozine;
	galva.metadata = { mobas: true };
	
	for (let i = 0; i < 4; i++) {
	    const koja = BABYLON.MeshBuilder.CreateBox("kiaulesKoja", {
		    width: 0.22,
			height: 0.45,
			depth: 0.22
		}, scene);
		
		koja.position.set(
		    (i % 2 === 0 ? -0.35 : 0.35),
		    0.22,
			(i < 2 ? -0.2 : 0.2)
		);
		
		koja.material = rozine;
		koja.parent = kiaule;
		koja.metadata = { mobas: true };
	}
}

sukurtiKiaule(5, -1.5, 5);

let kiaulesGreitis = 0.02;
let kiaulesKryptis = Math.random() * Math.PI * 2;
</script>
<script>

const inventorius = document.getElementById("inventorius");
const inventoriausBlokai = document.getElementById("inventoriausBlokai");

const visiBlokai = [
    "Zole",
	"Zeme",
	"Medis",
	"Akmuo",
	"Smelis",
	"Lapai"
];

let inventoriusAtidarytas = false;

inventorius.style.display = "none";

document.addEventListener("keydown", function(event) {
    if (event.key.toLowerCase() === "e") {
	    inventoriusAtidarytas = !inventoriusAtidarytas;
		inventorius.style.display = inventoriusAtidarytas ? "flex" : "none";
	}
});

visiBlokai.forEach(function(blokas) {
    const langelis = document.createElement("div");
	
	const kubelis = document.createElement("div");
	kubelis.className = "mazasKubas";
	
	const virsus = document.createElement("div");
	virsus.className = "kubelioVirsus";
	
	const kaire = document.createElement("div");
	kaire.className = "kubelioKaire";
	
	const desine = document.createElement("div");
	desine.className = "kubelioDesine";
	
	kubelis.append(virsus, kaire, desine);
	langelis.appendChild(kubelis);
	
	langelis.className = "inventoriausLangelis";
	inventoriausBlokai.appendChild(langelis);
});

const kubas = BABYLON.MeshBuilder.CreateBox("inventoriausKubas", {
    size: 0.7
}, scene);

const kuboMedziaga = new BABYLON.StandardMaterial("kuboMedziaga", scene);

kuboMedziaga.diffuseColor = new BABYLON.Color3(0.3, 0.7, 0.2);

kubas.material = kuboMedziaga;
kubas.setEnabled(false);

const perziurosCanvas = document.getElementById("blokuPerziura");

const perziurosEngine = new BABYLON.Engine(perziurosCanvas, true);

const perziurosScene = new BABYLON.Scene(perziurosEngine);

const perziurosKamera = new BABYLON.ArcRotateCamera(
    "perziurosKamera",
	-Math.PI / 2,
	Math.PI / 2.5,
    3,
	BABYLON.Vector3.Zero(),
	perziurosScene
);

perziurosKamera.attachControl(perziurosCanvas, true);

const perziurosSviesa = new BABYLON.HemisphericLight(
    "perziurosSviesa",
	new BABYLON.Vector3(0, 1, 0),
	perziurosScene
);

const perziurosKubas = BABYLON.MeshBuilder.CreateBox(
    "perziurosKubas",
	{ size: 1 },
	perziurosScene
);

const perziurosMedziaga = new BABYLON.StandardMaterial(
    "perziurosMedziaga",
	perziurosScene
);

perziurosMedziaga.diffuseColor = new BABYLON.Color3(0.3, 0.7, 0.2);

perziurosKubas.material = perziurosMedziaga;

</script>

<style>
<script>
let langeliai = document.querySelectorAll(".langelis");

document.addEventListener("keydown", function(event) {
    let skaicius = Number(event.key);
	
	if (skaicius >= 1 && skaicius <= 5) {
	    langeliai.forEach(function(langelis, index) {
		    langelis.classList.toggle("pasirinktas", index === skaicius - 1);
		});
	}
});
</script>
